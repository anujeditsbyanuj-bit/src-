# Reverse proxy config for Akbots' File-to-Link aiohttp server
# (Akbots/filetolink/web_server.py, default port 8070 / STREAM_PORT).
#
# WHY THIS SHAPE:
#   - proxy_buffering off + chunked_transfer_encoding on: the stream
#     routes send video/audio as they read it from Telegram, chunk by
#     chunk. If nginx buffers the whole response before forwarding, you
#     lose "starts playing instantly" and effectively add a second
#     buffering layer on top of the app's own.
#   - Range/Accept-Ranges pass straight through: MX Player/VLC/browser
#     seeking depends on nginx not touching these.
#   - Generous timeouts: large file downloads can legitimately sit on one
#     connection for a long time; nginx's 60s defaults will kill those.
#   - client_max_body_size matches STREAM_SPEEDTEST_MAX_MB (see config.py)
#     so nginx doesn't reject /speedtest/upload probes before the app
#     even sees them. Bump this if you raise STREAM_SPEEDTEST_MAX_MB.
#
# USAGE:
#   1. Copy this to /etc/nginx/sites-available/akbots-filetolink.conf
#   2. Edit `server_name` below to your real domain.
#   3. Set STREAM_TRUST_PROXY=true in your bot's env (so the app's own
#      per-IP rate limiter reads the real client IP from
#      X-Forwarded-For instead of nginx's own IP).
#   4. Set STREAM_FQDN=your.domain.com and STREAM_HAS_SSL=true so the
#      Stream/Download links the bot generates point at this domain.
#   5. `ln -s /etc/nginx/sites-available/akbots-filetolink.conf
#      /etc/nginx/sites-enabled/` and `nginx -t && systemctl reload nginx`.
#   6. Point DNS at this box, then get a cert (e.g. `certbot --nginx -d
#      your.domain.com`) — certbot will rewrite the listen 443 block for
#      you on top of this file.

upstream akbots_filetolink {
    # If you run multiple Akbots processes behind one domain (rare —
    # normally one process per bot token), add more server lines here;
    # nginx will round-robin across them.
    server 127.0.0.1:8070;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    # Bump if you raise STREAM_SPEEDTEST_MAX_MB in config.py — must be
    # >= that value or nginx 413s the upload probe before it reaches the app.
    client_max_body_size 100m;

    location / {
        proxy_pass http://akbots_filetolink;
        proxy_http_version 1.1;

        # Real client IP/host/proto so STREAM_TRUST_PROXY-enabled rate
        # limiting and any future proto-aware logic work correctly.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming, not buffering — see header comment above.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Range/seek support must pass through untouched.
        proxy_set_header Range $http_range;
        proxy_pass_header Accept-Ranges;
        proxy_pass_header Content-Range;

        # Large-file-friendly timeouts (default 60s is too short for a
        # multi-GB download held open on one connection).
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Let the app decide keep-alive behaviour; don't let nginx close
        # early on long-lived downloads.
        proxy_set_header Connection "";
    }
}

