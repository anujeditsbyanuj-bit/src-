name = "hls-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Deploy: `wrangler deploy` from inside this folder.
# API:    GET https://<your-worker>.workers.dev/api/hls?url=<m3u8 or segment URL>
#         GET https://<your-worker>.workers.dev/api/proxy?url=<any URL>
#
# Ported from the meowtv project's workers/hls-worker.js. Set the deployed
# workers.dev URL as HLS_WORKER_URL in the bot's .env / config (see config.py)
# so any plugin can build proxied playback links via Akbots/hls_proxy.py.
